org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.nonTransitiveRClass=true
kotlin.compiler.execution.strategy=in-process

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Default gateway backend baked into the app (BuildConfig.DEFAULT_BACKEND). Emulators ignore it and use
# http://10.0.2.2:8080. Currently relay.harshvs.com, a domain mapped to the Cloud Run service in tuning-machines. Override per build with
# -Prelay.backendUrl=... ; debug builds can change it in Settings, release builds cannot.
relay.backendUrl=https://relay.harshvs.com

# First-run value of the "Help locate neighbours" switch (BuildConfig.HELP_LOCATE_DEFAULT): when on, a phone with a good
# GPS fix tells nearby phones and the control room roughly where it is if a neighbour's phone has no GPS (LOC_HINT,
# SPEC 5.5). true = demo build (default). Village builds pass -Prelay.helpLocateDefault=false so sharing is opt-in.
relay.helpLocateDefault=true
