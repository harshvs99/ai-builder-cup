[project]
name = "relay-backend"
version = "0.1.0"
description = "Relay backend: ingests mesh need packets, clusters them into tickets, queues ACKs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "google-genai>=1.0",
    "google-cloud-firestore>=2.19",
    "google-cloud-pubsub>=2.23",
    "google-auth>=2.30",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "firestore: runs against the Firestore emulator (auto-skipped when FIRESTORE_EMULATOR_HOST is unreachable)",
]
